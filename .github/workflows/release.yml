name: Release
on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/release.yml'
      - 'go.mod'
  workflow_dispatch:

env:
  # SDK identity baked in at generation time from the in-memory build context,
  # so the workflow never reads go.mod or any other file at runtime.
  SDK_VERSION: '1.0.0'
  SDK_MODULE_PATH: 'example.com/main-api-sdk'
  RELEASE_TAG: 'v1.0.0'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create tag if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/git/refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::Tag $RELEASE_TAG already exists, nothing to do"
            exit 0
          fi
          gh api -X POST "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="${{ github.sha }}"
          echo "::notice::Created tag $RELEASE_TAG at ${{ github.sha }}"
      # Go has no central package registry to upload to: the semver Git tag IS
      # the published release. The module proxy (proxy.golang.org) and pkg.go.dev
      # index modules on demand the first time someone fetches them, so there is
      # no upload step and the tag created above is what publishes the version.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          fi
