  /v1/api/assistant/chat:
    post:
      description: |
        ### Overview

        Send a message to the AI Assistant. Optionally include a `session_id` to resume a previous conversation. If no `session_id` is given, the AI will have no previous context and will create a new conversation.

        Also included is a way to upload `files` in base64 allowing you to attach a file that the AI Assistant can use.

        We also allow you to send `blocks` which is a list of strings that state what additional features your chat interface includes. If no `blocks` are sent, responses are sent in plain text and markdown (for things like tables or bolding text).

        The answer is streamed as plain text while it is written. Send the header `Accept: text/event-stream` to get it as server-sent events instead: `tool` with the `name` of each tool the assistant uses, `text` with each piece of the answer, `support` with the `id` of the support conversation when the chat is handed to the support team, `usage` with the share of the day's allowance that is `used` and when it `resets_at`, `error` with the error if the answer fails, and `done` at the end.

        ```
        event: tool
        data: {"name": "get_torrent_list"}

        event: text
        data: {"text": "You have 2 torrents, "}

        event: text
        data: {"text": "and both have finished downloading."}

        event: usage
        data: {"used": 0.0123, "resets_at": "2026-01-01T00:00:00Z"}

        event: done
        data: {}
        ```

        The `X-Session-ID` response header holds the `session_id` to send with the next message.

        ### Authorization

        Requires an API key using the Authorization Bearer Header.
      operationId: chat_with_assistant
      requestBody:
        content:
          application/json:
            example:
              message: string
              session_id: string
              files:
              - name: string
                data: string
              blocks:
              - string
            schema:
              $ref: "#/components/schemas/ChatRequest"
        required: true
      responses:
        "200":
          content:
            text/plain:
              examples:
                Success:
                  value: |
                    Hello! What can I help you with? I can check your downloads, add a magnet, link or NZB file you have, manage your account settings or look into a problem.
              schema:
                type: string
          description: Successful Response
        "401":
          content:
            application/json:
              examples:
                Fail NO_AUTH:
                  value:
                    success: false
                    error: NO_AUTH
                    detail: Please provide a valid API token.
                    data: null
                Fail BAD_TOKEN:
                  value:
                    success: false
                    error: BAD_TOKEN
                    detail: Your token is invalid or has expired. Please log in again
                      or reset your token.
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "403":
          content:
            application/json:
              examples:
                Fail AUTH_ERROR:
                  value:
                    success: false
                    error: AUTH_ERROR
                    detail: An error occurred while verifying your token. Please try
                      again.
                    data: null
                Fail AI_DISABLED:
                  value:
                    success: false
                    error: AI_DISABLED
                    detail: AI features are turned off for this account. You can turn
                      them back on in your settings.
                    data: null
                Fail PLAN_RESTRICTED_FEATURE:
                  value:
                    success: false
                    error: PLAN_RESTRICTED_FEATURE
                    detail: The assistant is not available on the free plan. Please
                      upgrade to a paid plan to use it.
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Forbidden
        "404":
          content:
            application/json:
              examples:
                Fail ENDPOINT_NOT_FOUND:
                  value:
                    success: false
                    error: ENDPOINT_NOT_FOUND
                    detail: Endpoint not found. Please check the URL and try again.
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
        "429":
          content:
            application/json:
              examples:
                Fail ASSISTANT_FREE_LIMIT:
                  value:
                    success: false
                    error: ASSISTANT_FREE_LIMIT
                    detail: "You have used the free plan's assistant messages for\
                      \ today. Upgrade your plan to keep chatting, or come back after\
                      \ 00:00 UTC."
                    data:
                      resets_at: 2026-01-01T00:00:00Z
                Fail ASSISTANT_DAILY_LIMIT:
                  value:
                    success: false
                    error: ASSISTANT_DAILY_LIMIT
                    detail: You have reached today's limit for the assistant. It resets
                      at 00:00 UTC.
                    data:
                      resets_at: 2026-01-01T00:00:00Z
                Fail RATE_LIMIT_EXCEEDED:
                  value:
                    success: false
                    error: RATE_LIMIT_EXCEEDED
                    detail: 300 per 1 minute
                    data: null
                Fail RATE_LIMIT_EXCEEDED (2):
                  value:
                    success: false
                    error: RATE_LIMIT_EXCEEDED
                    detail: 5 per 1 minute
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Too Many Requests
        "500":
          content:
            application/json:
              examples:
                Fail ASSISTANT_ERROR:
                  value:
                    success: false
                    error: ASSISTANT_ERROR
                    detail: There was an error with the assistant. Please try again
                      later.
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal Server Error
        "503":
          content:
            application/json:
              examples:
                Fail AUTH_UNAVAILABLE:
                  value:
                    success: false
                    error: AUTH_UNAVAILABLE
                    detail: We couldn't verify your token right now. Please try again
                      shortly.
                    data: null
                Fail AUTH_UNAVAILABLE (2):
                  value:
                    success: false
                    error: AUTH_UNAVAILABLE
                    detail: There was an error verifying your API key. Please try
