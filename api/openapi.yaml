  schemas:
    AddRss:
      example:
        url: url
        name: name
        do_regex: do_regex
        dont_regex: dont_regex
        dont_older_than: 0
        pass_check: false
        scan_interval: 6
        rss_type: torrent
        torrent_seeding: 1
      properties:
        url:
          description: URL of the rss feed you want to add.
          title: Url
          type: string
        name:
          description: Display name of the rss feed you want to add.
          title: Name
          type: string
        do_regex:
          description: Regex of items you want to make sure are added. Optional.
          title: Do Regex
          type: string
          x-torbox-nullable: true
        dont_regex:
          description: Regex of items you dont want added. Optional.
          title: Dont Regex
          type: string
          x-torbox-nullable: true
        dont_older_than:
          description: Time in days that tells the parser to skip if the torrent is
            older than that many days. Optional.
          format: int64
          title: Dont Older Than
          type: integer
          x-torbox-nullable: true
        pass_check:
          default: false
          description: Boolean which tells to allow multiple of the same url if it
            already exists on your account
          title: Pass Check
          type: boolean
          x-torbox-nullable: true
        scan_interval:
          default: 60
          description: Time in minutes with the minimum being 10 which you want the
            api to scan in interval. Optional. Default is 60.
          format: int64
          title: Scan Interval
          type: integer
          x-torbox-nullable: true
        rss_type:
          default: torrent
          description: "The type of downloads inside of this RSS feed. Optional. Default\
            \ is torrent. Options are \"torrent\", \"usenet\", \"webdl\""
          title: Rss Type
          type: string
        torrent_seeding:
          default: 1
          description: "Determines if torrents inside of this RSS feed will seed or\
            \ not. Optional. Default is 1, for auto. Options are 1 for auto, 2 for\
            \ always, and 3 for never."
          format: int64
          title: Torrent Seeding
          type: integer
          x-torbox-nullable: true
      required:
      - name
      - url
      title: AddRss
