  /v1/api/torrents/edittorrent:
    put:
      description: |
        ### Overview

        Updates a download item based on the item's ID.
        Sending a PUT request with valid items overwrites the previous items entirely, so use this endpoint with caution. Please make sure to read the restrictions below as they are important.

        ### Restrictions

        - Does not affect the cached database (or any other user's item).

        - Name must pass validation:

            - Above 1 character long.

            - Below 200 characters long.

            - Cannot contain any non-url or non filesystem safe characters. (This is removed automatically).

            - Cannot contain any leading or trailing whitespace. You can have spaces in the middle. (This is removed automatically).

        - Tags follow the same rules as the name.

        - Alternative hashes must be of MD5, SHA1, or SHA256.


        ### Authorization

        Requires an API key using the Authorization Bearer Header.
      operationId: edit_torrent_item
      requestBody:
        content:
          application/json:
            example:
              torrent_id: 0
              name: string
              tags:
              - string
              alternative_hashes:
              - 0123456789abcdef0123456789abcdef01234567
              airlocked: false
            schema:
              $ref: "#/components/schemas/EditTorrent"
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                Success:
                  value:
                    success: true
                    error: null
                    detail: Torrent edited successfully.
                    data: null
              schema:
                $ref: "#/components/schemas/EditTorrentItemResponse"
          description: Successful Response
        "400":
          content:
            application/json:
              examples:
                Fail NO_CHANGES:
                  value:
                    success: false
                    error: NO_CHANGES
                    detail: No applicable changes provided. Please provide at least
                      one field to update.
                    data: null
                Fail NAME_TOO_LONG:
                  value:
                    success: false
                    error: NAME_TOO_LONG
                    detail: Name must be less than 200 characters.
                    data: null
                Fail NAME_TOO_SHORT:
                  value:
                    success: false
                    error: NAME_TOO_SHORT
                    detail: Name must be at least 1 character.
                    data: null
                Fail NAME_TOO_SHORT (2):
                  value:
                    success: false
                    error: NAME_TOO_SHORT
                    detail: "Invalid tag: ??. Name must be at least 1 character."
                    data: null
                Fail INVALID_HASH:
                  value:
                    success: false
                    error: INVALID_HASH
                    detail: "Invalid hash: XXX. Hashes must be MD5, SHA1, or SHA256."
                    data: null
                Fail NAME_TOO_LONG (2):
                  value:
                    success: false
                    error: NAME_TOO_LONG
                    detail: "Invalid tag: XXX. Name must be less than 200 characters."
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Bad Request
        "401":
          content:
            application/json:
              examples:
                Fail NO_AUTH:
                  value:
                    success: false
                    error: NO_AUTH
                    detail: Please provide a valid API token.
                    data: null
                Fail BAD_TOKEN:
