                    error: null
                    detail: Usenet download requested successfully.
                    data: https://tb-cdn.xx/zip/XXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX?token=XXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
              schema:
                $ref: "#/components/schemas/RequestUsenetDownloadLinkResponse"
          description: Successful Response
