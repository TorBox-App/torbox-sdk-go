  /v1/api/torrents/createtorrent:
    post:
      description: |
        ### Overview

        Creates a torrent under your account. Simply send **either** a magnet link, or a torrent file. Once they have been checked, they will begin downloading assuming your account has available active download slots, and they aren't too large.

        ### Rate Limits

        This endpoint has two limits that apply at the same time:

        - **300 requests per minute:** a shared ceiling that _every_ request counts against, whether the torrent is cached or uncached.

        - **60 uncached torrents per hour:** an additional, stricter limit that only uncached torrents count against. A request sent with `add_only_if_cached` is not counted, because it adds nothing when the torrent is not cached. It is counted when it is also sent with `as_queued`, because a queued torrent is added whether it is cached or not.


        The important thing is that cached and uncached requests both draw from the same 300/min pool, but uncached requests _also_ draw from their own separate 60/hour pool. An uncached request therefore counts twice: once against the per-minute limit, and once against the per-hour uncached limit.

        **Example:** In a single minute you add 250 cached + 50 uncached torrents. That's 300 total, so you've hit the per-minute limit for that minute. But those 50 uncached torrents also came out of your 60/hour uncached budget, leaving only **10 uncached torrents** for the remaining 59 minutes of that hour. (You could still add plenty more _cached_ torrents during that hour, since cached requests aren't capped hourly: only by the 300/min ceiling.)

        ### Authorization

        Requires an API key using the Authorization Bearer Header.
      operationId: create_torrent
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Body_create_torrent"
      responses:
        "200":
          content:
            application/json:
              examples:
                Success:
                  value:
                    success: true
                    error: null
                    detail: Torrent Added Successfully
                    data:
                      hash: string
                      torrent_id: 0
                      auth_id: string
                Success CACHED:
                  value:
                    success: true
                    error: null
                    detail: Found Cached Torrent. Using Cached Torrent.
                    data:
                      hash: string
                      torrent_id: 0
                      auth_id: string
                Success QUEUED:
                  value:
                    success: true
                    detail: Torrent queued successfully.
                    data:
                      hash: string
                      name: string
                      queued_id: 0
              schema:
                $ref: "#/components/schemas/CreateTorrentResponse"
          description: Successful Response
        "400":
          content:
            application/json:
              examples:
                Fail MISSING_REQUIRED_OPTION:
                  value:
                    success: false
                    error: MISSING_REQUIRED_OPTION
                    detail: You must provide either a file or magnet link.
                    data: null
                Fail TOO_MANY_OPTIONS:
                  value:
                    success: false
                    error: TOO_MANY_OPTIONS
                    detail: "You must provide either a file or magnet link, not both."
                    data: null
                Fail BOZO_TORRENT:
                  value:
                    success: false
                    error: BOZO_TORRENT
                    detail: Torrent file is not valid. Please provide a valid torrent
                      file.
                    data: null
                Fail TOO_MUCH_DATA:
                  value:
                    success: false
                    error: TOO_MUCH_DATA
                    detail: Torrent file is too large. Please provide a torrent file
                      smaller than 100MB.
                    data: null
                Fail DOWNLOAD_TOO_LARGE:
                  value:
                    success: false
                    error: DOWNLOAD_TOO_LARGE
                    detail: Your torrent could not be added because it is larger than
                      200GB. Please upgrade your plan to add larger torrents.
                    data: null
                Fail DOWNLOAD_TOO_LARGE (2):
                  value:
                    success: false
                    error: DOWNLOAD_TOO_LARGE
                    detail: Your torrent could not be added because it is larger than
                      1TB. Your plan does not support torrents this large.
                    data: null
                Fail BOZO_TORRENT (2):
                  value:
                    success: false
                    error: BOZO_TORRENT
                    detail: Invalid Torrent File. Please try again.
                    data: null
                Fail URL_NOT_ALLOWED:
