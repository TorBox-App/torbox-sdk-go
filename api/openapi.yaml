                      daily_bandwidth_used: 0
                      per_link_size_limit: 214748364800
                      regex: "^https?://(?:[^./]+\\.)*(1fichier\\.com)(/|$)"
                    - id: 3
                      name: ClicknUpload
                      domains:
                      - clicknupload.click
                      - clicknupload.com
                      - clicknupload.org
                      - clicknupload.cc
                      - clicknupload.me
                      - clicknupload.link
                      - clicknupload.club
                      - clicknupload.red
                      - clickndownload.cfd
                      - clicknupload.to
                      - clicknupload.co
                      - clicknupload.me
                      - clicknupload.online
                      - clicknupload.download
                      - clicknupload.vip
                      - clicknupload.site
                      - clicknupload.xyz
                      - clicknupload.one
                      - clicknupload.name
                      - clicknupload.space
                      url: https://clicknupload.click
                      icon: https://torbox.app/images/hoster-icons/clicknupload.png
                      status: false
                      type: hoster
                      note: null
                      nsfw: false
                      daily_link_limit: 50
                      daily_link_used: 0
                      daily_bandwidth_limit: 5368709120000
                      daily_bandwidth_used: 0
