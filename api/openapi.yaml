  /v1/api/torrents/requestdl:
    get:
      description: |
        ### Overview

        Requests the download link from the server. Because downloads are metered, TorBox cannot afford to allow free access to the links directly. This endpoint opens the link for 3 hours for downloads. Once a download is started, the user has nearly unlilimited time to download the file. The 1 hour time limit is simply for starting downloads. This prevents long term link sharing.

        ### Permalinks

        Instead of generating many CDN urls by requesting this endpoint, you can instead create a permalink such as: `https://api.torbox.app/v1/api/torrents/requestdl?token=APIKEY&torrent_id=NUMBER&file_id=NUMBER&redirect=true` and when a user clicks on it, it will automatically redirect them to the CDN link. This saves requests and doesn't abuse the API. Use this method rather than saving CDN links as they are not permanent. To invalidate these permalinks, simply reset your API token or delete the item from your dashboard.

        ### Authorization

        Requires an API key as a parameter for the `token` parameter.
      operationId: request_torrent_download_link
      parameters:
      - description: Your API Key
        explode: true
        in: query
        name: token
        required: true
        schema:
          title: Token
          type: string
        style: form
      - description: The torrent's ID that you want to download
        explode: true
        in: query
        name: torrent_id
        required: true
        schema:
          format: int64
          title: Torrent Id
          type: integer
        style: form
      - description: The files's ID that you want to download
        explode: true
        in: query
        name: file_id
        required: false
        schema:
          default: 0
          format: int64
          title: File Id
          type: integer
        style: form
      - description: If you want a zip link. Required if no file_id. Takes precedence
          over file_id if both are given.
        explode: true
        in: query
        name: zip_link
        required: false
        schema:
          default: false
          title: Zip Link
          type: boolean
        style: form
      - description: The user's IP to determine the closest CDN. Optional.
        explode: true
        in: query
        name: user_ip
        required: false
        schema:
          title: User Ip
          type: string
        style: form
      - description: If you want to redirect the user to the CDN link. This is useful
          for creating permalinks so that you can just make this request URL the link.
        explode: true
        in: query
        name: redirect
        required: false
        schema:
          default: false
          title: Redirect
          type: boolean
        style: form
      - description: If you want to add the "filename" parameter to the returned CDN
          link. Optional. Default false.
        explode: true
        in: query
        name: append_name
        required: false
        schema:
          default: false
          title: Append Name
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                Success:
                  value:
                    success: true
                    error: null
                    detail: Torrent download requested successfully.
                    data: https://example.com/download.zip
              schema:
                $ref: "#/components/schemas/RequestTorrentDownloadLinkResponse"
          description: Successful Response
        "307":
          description: Temporary Redirect
        "401":
          content:
            application/json:
              examples:
                Fail NO_AUTH:
                  value:
                    success: false
                    error: NO_AUTH
                    detail: Please provide a valid API token.
                    data: null
                Fail BAD_TOKEN:
                  value:
                    success: false
                    error: BAD_TOKEN
                    detail: Your token is invalid or has expired. Please log in again
                      or reset your token.
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "403":
          content:
            application/json:
              examples:
                Fail AUTH_ERROR:
                  value:
                    success: false
                    error: AUTH_ERROR
                    detail: An error occurred while verifying your token. Please try
                      again.
                    data: null
                Fail PLAN_RESTRICTED_FEATURE:
                  value:
                    success: false
