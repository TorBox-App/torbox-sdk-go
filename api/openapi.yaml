openapi: 3.1.0
info:
  contact:
    email: contact@torbox.app
    name: TorBox
    url: https://torbox.app/
  description: "Client for the TorBox API (https://api.torbox.app). Guides and reference:\
    \ https://api-docs.torbox.app"
  license:
    name: Proprietary
    url: https://torbox.app/policies/terms
  termsOfService: https://torbox.app/policies/terms
  title: TorBox API
  version: 1.0.0
servers:
- url: https://api.torbox.app
tags:
- description: "Torrents are TorBox's main use, and using the TorBox API you can easily\
    \ add torrents just by providing a magnet link or a torrent file as well as you\
    \ API key. You can also easily control those torrents by providing the torrent's\
    \ ID, which allows you to _reannounce_, _pause_, _resume_, and _delete_ the torrents."
  name: Torrents
- description: "Usenet is a newer feature of TorBox, which allows you to access the\
    \ Usenet simply using TorBox and our easy to use API. Results will look exactly\
    \ the same as torrents, which is why there are less examples here."
  name: Usenet
- description: "Web Downloads are another use of TorBox. Adding links such as images,\
    \ Youtube videos and more can be an easy way to download them and add them to\
    \ your device. This API is practically the same as the Usenet and Torrents API."
  name: WebDownloads
- description: "These are the general endpoints for TorBox. They aren't mission critical,\
    \ but if your app or service needs them, they are here."
  name: General
- description: Notifications are important for TorBox to always know what is happening
    with your account or your torrents. This route allows your to get and view your
    notifications.
  name: Notifications
- description: This is the way to identify TorBox user's as well as get information
    about the user you are working with. This data contains important endpoints that
    allow you to control and view data on the account.
  name: User
- description: "For Pro Users you can add RSS feeds which automate adding torrents\
    \ to your TorBox. If you TorBox becomes full, the torrent will be queued and added\
    \ at the first chance it gets. Along with adding RSS feeds you are able to control\
    \ RSS feeds as well as modify existing ones."
  name: Rss
- description: "Integrations is the route for connecting to 3rd party services. This\
    \ includes OAuth, Jobs, and creating integration connections."
  name: Integrations
- description: "TorBox's queued service is like no other, and is a feature that no\
    \ one else in this space has. TorBox is proud to allow the use of the queue system\
    \ over the API, and these are the docs for how to do so!"
  name: Queued
- description: "With the release of TorBox v8.1 we are introducing the ability to\
    \ stream any video file directly in your browser, and this is fully powered by\
    \ our API, which is available for developers to integrate into their apps. With\
    \ minimal wait times for stream starts, low bandwidth streaming, and integrated\
    \ subtitles and audio choosing, this API makes it simple to create a web player\
    \ based off of a user's TorBox video files."
  name: Stream
- description: "Here you can manage tags, get user tags, and manage the tags attached\
    \ to a user's account. This is compared to the previous which was very tedious,\
    \ and made the adoption of tags slow. With this new route, tags are much easier\
    \ to use and manage."
  name: Tags
- description: TorBox's AI assistant! Use this route to implement TorBox's AI assistant
    into your app. Give your users the power of a personal TorBox AI no matter what
    app they are using.
  name: Assistant
- description: "A vendor account lets one TorBox account own and manage other TorBox\
    \ user accounts. It is registered on top of your existing TorBox account, starts\
    \ with the status \"pending\" while it waits for approval, and carries its own\
    \ name, URL, plan, paid-until date and user limit."
  name: Vendors
paths:
  /v1/api/user/refreshtoken:
    post:
      description: |
        ### Overview

        If you want a new API token, or your old one has been compromised, you may request a new one. If you happen to forget the token, go the [TorBox settings page ](https://torbox.app/settings) and copy the current one. If this still doesn't work, you may contact us at our support email for a new one.

        ### Authorization

        Requires an API key using the Authorization Bearer Header as well as passing the `session_token` from the website to be passed in the body. You can find the `session_token` in the localStorage of your browser on any TorBox.app page under the key `torbox_session_token`. This is a temporary token that only lasts for 1 hour, which is why it is used here to verify the identity of a user as well as their API token.
      operationId: refresh_api_token
      requestBody:
        content:
          application/json:
            example:
              session_token: string
            schema:
              $ref: "#/components/schemas/RefreshTokenSchema"
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                Success:
                  value:
                    success: true
                    error: null
                    detail: Successfully refreshed your API key.
                    data: string
              schema:
                $ref: "#/components/schemas/RefreshApiTokenResponse"
          description: Successful Response
        "401":
          content:
            application/json:
              examples:
                Fail NO_AUTH:
                  value:
                    success: false
                    error: NO_AUTH
                    detail: Please provide a valid API token.
                    data: null
                Fail BAD_TOKEN:
                  value:
                    success: false
                    error: BAD_TOKEN
                    detail: Your token is invalid or has expired. Please log in again
                      or reset your token.
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "403":
          content:
            application/json:
              examples:
                Fail AUTH_ERROR:
                  value:
                    success: false
                    error: AUTH_ERROR
                    detail: An error occurred while verifying your token. Please try
                      again.
                    data: null
                Fail PLAN_RESTRICTED_FEATURE:
                  value:
                    success: false
                    error: PLAN_RESTRICTED_FEATURE
                    detail: API feature not available on your plan. Please upgrade
                      to a paid plan to access the API.
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Forbidden
        "404":
          content:
            application/json:
              examples:
                Fail ENDPOINT_NOT_FOUND:
                  value:
                    success: false
                    error: ENDPOINT_NOT_FOUND
                    detail: Endpoint not found. Please check the URL and try again.
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
        "429":
          content:
            application/json:
              examples:
                Fail RATE_LIMIT_EXCEEDED:
                  value:
                    success: false
                    error: RATE_LIMIT_EXCEEDED
                    detail: 300 per 1 minute
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Too Many Requests
        "500":
          content:
            application/json:
              examples:
                Fail DATABASE_ERROR:
                  value:
                    success: false
                    error: DATABASE_ERROR
                    detail: There was an error refreshing your API key. Please try
                      again later.
                    data: null
                Fail UNKNOWN_ERROR:
                  value:
                    success: false
                    error: UNKNOWN_ERROR
                    detail: There was an error refreshing your API key. Please try
                      again later.
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal Server Error
        "503":
          content:
            application/json:
              examples:
                Fail AUTH_UNAVAILABLE:
                  value:
                    success: false
                    error: AUTH_UNAVAILABLE
                    detail: We couldn't verify your token right now. Please try again
                      shortly.
                    data: null
                Fail AUTH_UNAVAILABLE (2):
                  value:
                    success: false
                    error: AUTH_UNAVAILABLE
                    detail: There was an error verifying your API key. Please try
                      again later.
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Service Unavailable
      security:
      - ApiKey: []
      summary: Refresh API Token
      tags:
      - User
