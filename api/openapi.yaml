  /v1/api/changelogs/rss:
    get:
      description: |
        ### Overview

        Gets most recent 100 changelogs from [https://feedback.torbox.app/changelog](https://feedback.torbox.app/changelog). This is useful for people who want updates on the TorBox changelog. Includes all the necessary items to make this compatible with RSS feed viewers for notifications, and proper HTML viewing.

        ### Authorization

        None needed.
      operationId: get_changelogs_rss_feed
      parameters:
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int64
          title: Offset
          type: integer
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 10
          format: int64
          title: Limit
          type: integer
        style: form
      responses:
        "200":
          content:
            application/xml:
              examples:
                Success:
                  value: |
                    <?xml version="1.0" ?>
                    <rss version="2.0" xmlns:atom="http://www.w3.org/2005/Atom" xmlns:media="http://search.yahoo.com/mrss/">
                      <channel>
                        <title>TorBox Changelogs</title>
                        <link>https://api.torbox.app/v1/api/changelogs/rss</link>
                        <description>TorBox Notifications</description>
                        <atom:link href="https://api.torbox.app/v1/api/changelogs/rss" rel="self" type="application/rss+xml"/>
                        <item>
                          <title>v9.2</title>
                          <link>https://torbox.app/changelog#v92</link>
                          <guid>116</guid>
                          <description>&amp;lt;h2&amp;gt;Website&amp;lt;/h2&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Creating an account now properly requires you to agree to our Terms of Service as well as our Privacy Policy.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;When signing up with a referral code, upon account creation, the code is automatically added to your account.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;When signing up, you have the option to subscribe to two different types of marketing emails.&amp;lt;/p&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;The first email is for “New features and updates”, which are sent about once a month, or when we have a new update or feature to release.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;The second email is for “Deals and promotions”, which is general marketing. We send these when we have a new deal, or promotion, or have something general to email you about.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;These are both completely optional and not required. You are also able to easily unsubscribe from the &amp;lt;a target=&amp;quot;&amp;quot; rel=&amp;quot;noopener noreferrer nofollow&amp;quot; class=&amp;quot;link&amp;quot; href=&amp;quot;https://torbox.app/settings?section=notifications&amp;quot;&amp;gt;settings page&amp;lt;/a&amp;gt;, or when you get one of these emails.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;You can now subscribe and unsubscribe from the different type of marketing emails in the &amp;lt;a target=&amp;quot;&amp;quot; rel=&amp;quot;noopener noreferrer nofollow&amp;quot; class=&amp;quot;link&amp;quot; href=&amp;quot;https://torbox.app/settings?section=notifications&amp;quot;&amp;gt;settings page&amp;lt;/a&amp;gt;. The Notifications Settings page is now also split up into two different sections, transactional emails, which are for general notifications relating to downloads, payments and others; and marketing, which is for updates about the platform in general, and not relating to your account.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;h2&amp;gt;Service&amp;lt;/h2&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;The TorBox CDN gains over 30% performance increase, including single connection speed, multi-connection speed, ramp up speed, seek speed and TTFB (time to first byte), which should all improve how fast your downloads begin.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Files should now be more compatible with all video player software to prevent infinite loading in some cases with specific files with specific video players.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;h2&amp;gt;API&amp;lt;/h2&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;The API was further optimized across multiple calls, including any route that accepts authentication, saving around 20ms per request, adding up to thousands of hours of CPU time saved over the course of a year, for a single optimization. More routes were optimized to stack savings, as well.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;h2&amp;gt;Web Downloads&amp;lt;/h2&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Optimizes Telegram downloads providing up to 3x more download speed than previously.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Optimizes Mega downloads providing more than 4x more download speed than previously.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Fixes Datavaults downloads.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Makes YouTube downloads more reliable.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Makes HubDrive downloads more reliable.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Adds Discord downloader. Accepts Discord cdn links.&amp;lt;/p&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;This was needed for the Discord bot, read below.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Fixes and re-enables the Katfile downloader.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Fixes and re-enables the Fileq downloader.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Fixes and re-enables the Sharemods downloader.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Fixes and re-enables the MegaUp downloader.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Fixes and re-enables the DailyUploads downloader.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Fixes and re-enables the Buzzheavier downloader.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Fixes the Fuckingfast downloader.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;h2&amp;gt;Discord Bot&amp;lt;/h2&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;The Discord bot now accepts files in DMs. Simply send a file to the Discord bot directly, and the file will be added to your TorBox account.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Discord bot link button takes you directly to the login screen so you can link your TorBox and Discord accounts without much navigating.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;h2&amp;gt;Telegram Bot&amp;lt;/h2&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;The Telegram bot now accepts files directly. Simply forward or send a file to the Telegram bot and the file will be added to your TorBox account.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;p&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;&amp;lt;/p&amp;gt;</description>
                          <pubDate>2026-08-17T11:16:45.710000+00:00</pubDate>
                          <media:content url="https://imagedelivery.net/wjdNJcfLJD9TRxMb-PzPxw/torbox-changelog-v92/public" medium="image"/>
                        </item>
                        <item>
                          <title>v9.1</title>
                          <link>https://torbox.app/changelog#v91</link>
                          <guid>115</guid>
                          <description>&amp;lt;h2&amp;gt;T3&amp;lt;/h2&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Fixes random 403 errors on HEAD/GET.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Allows &amp;lt;a target=&amp;quot;&amp;quot; rel=&amp;quot;noopener noreferrer nofollow&amp;quot; class=&amp;quot;link&amp;quot; href=&amp;quot;https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_sigv.html&amp;quot;&amp;gt;v4a authentication&amp;lt;/a&amp;gt;.&amp;lt;/p&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;This now means T3 supports all authentication types available.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Lists more than 10k items.&amp;lt;/p&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;If you have more than 10k torrents, it will now show all of them.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;h2&amp;gt;WebDAV&amp;lt;/h2&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Lists more than 10k items.&amp;lt;/p&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;If you have more than 10k torrents, it will now show all of them.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;h2&amp;gt;API&amp;lt;/h2&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;The API was rewritten to be fully async, which means less timeout errors, and better reliability.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Download links are now much faster, going from best case scenario of ~300ms → ~150ms, a 100% increase from before! This is definitely a noticeable increase.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;h2&amp;gt;Website&amp;lt;/h2&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Adds Greek, Vietnamese, and Thai languages to available preferred subtitle and audio languages in the web player settings.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;h2&amp;gt;Web Downloads&amp;lt;/h2&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Fixes AnnasArchives downloads.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Adds Telegram downloader. Simply copy a message link which contains media and paste it into TorBox, and it will begin downloading!&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Adds TransferNow downloader. Supports folders as well as password protected files.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Fixes Filer downloads.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Fixes issues with Mega folder downloads size not being properly counted.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Makes large 1Fichier downloads more reliable.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Fixes unreliable YouTube downloads.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Fixes HubCloud downloads.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Fixes Vikingfile downloads in some cases.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Pixeldrain now skips undownloadable files rather than marking the entire list as failed. Pixeldrain also now allows “filesystem” direct downloads.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Fixes Datavaults downloads.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Users will no longer be able to submit downloads to the API when the Web Downloader is marked offline, or when that hoster is marked offline.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Sendnow allows for direct links.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Fixes Datanodes downloads.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;h2&amp;gt;Transcoding Server&amp;lt;/h2&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Improves performance when streaming, meaning better seeking times, less buffering, and more segments instantly available.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;h2&amp;gt;Service&amp;lt;/h2&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;New policies, located at &amp;lt;a target=&amp;quot;_blank&amp;quot; rel=&amp;quot;noopener noreferrer nofollow&amp;quot; class=&amp;quot;link&amp;quot; href=&amp;quot;https://torbox.app/policies&amp;quot;&amp;gt;https://torbox.app/policies&amp;lt;/a&amp;gt;, which shows our new comprehensive set of policies. Largely TorBox remains unchanged with these new policies, but they were enacted to protect your rights and privacy, as well as our own.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;TorBox main headquarters moves from South Africa to Dubai.&amp;lt;/p&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;This was done due to the instability of the country in the recent times.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;p&amp;gt;Our AI agents that handle support are much smarter with the ability to access your basic account information such as account plan, days on account, recent transactions, and more.&amp;lt;/p&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;p&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;&amp;lt;/p&amp;gt;</description>
                          <pubDate>2026-07-31T05:45:48.424000+00:00</pubDate>
                          <media:content url="https://imagedelivery.net/wjdNJcfLJD9TRxMb-PzPxw/torbox-changelog-v91/public" medium="image"/>
                        </item>
                      </channel>
                    </rss>
              schema:
                type: string
          description: Successful Response
        "404":
          content:
            application/json:
              examples:
                Fail ENDPOINT_NOT_FOUND:
                  value:
                    success: false
                    error: ENDPOINT_NOT_FOUND
                    detail: Endpoint not found. Please check the URL and try again.
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
        "429":
          content:
            application/json:
              examples:
                Fail RATE_LIMIT_EXCEEDED:
                  value:
                    success: false
                    error: RATE_LIMIT_EXCEEDED
                    detail: 300 per 1 minute
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Too Many Requests
        "500":
          content:
            application/json:
              examples:
                Fail DATABASE_ERROR:
                  value:
                    success: false
                    error: DATABASE_ERROR
                    detail: There was an error getting the changelogs. Please try
                      again later.
                    data: null
                Fail UNKNOWN_ERROR:
                  value:
                    success: false
                    error: UNKNOWN_ERROR
                    detail: There was an error getting the RSS changelogs. Please
                      try again later.
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal Server Error
        "503":
          content:
            application/json:
              examples:
                Fail DATABASE_ERROR:
                  value:
                    success: false
                    error: DATABASE_ERROR
                    detail: The database is temporarily unavailable. Please try again
                      shortly.
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Service Unavailable
      summary: Get Changelogs RSS Feed
      tags:
      - General
  /v1/api/changelogs/json:
    get:
      description: |
        ### Overview

        Gets most recent changelogs from [https://feedback.torbox.app/changelog](https://feedback.torbox.app/changelog). This is useful for developers who want to integrate the changelog into their apps for their users to see. Includes content in HTML for developers to easily render the text in a fancy yet simple way.

        ### Authorization

        None needed.
      operationId: get_changelogs_json
      parameters:
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int64
          title: Offset
          type: integer
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 10
          format: int64
          title: Limit
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                Success:
                  value:
                    success: true
                    error: null
                    detail: Successfully retrieved changelogs.
                    data:
                    - id: 116
                      html: "<h2>Website</h2><ul><li><p>Creating an account now properly\
                        \ requires you to agree to our Terms of Service as well as\
                        \ our Privacy Policy.</p></li><li><p>When signing up with\
                        \ a referral code, upon account creation, the code is automatically\
                        \ added to your account.</p></li><li><p>When signing up, you\
                        \ have the option to subscribe to two different types of marketing\
                        \ emails.</p><ul><li><p>The first email is for “New features\
                        \ and updates”, which are sent about once a month, or when\
                        \ we have a new update or feature to release.</p></li><li><p>The\
                        \ second email is for “Deals and promotions”, which is general\
                        \ marketing. We send these when we have a new deal, or promotion,\
                        \ or have something general to email you about.</p></li><li><p>These\
                        \ are both completely optional and not required. You are also\
                        \ able to easily unsubscribe from the <a target=\"\" rel=\"\
                        noopener noreferrer nofollow\" class=\"link\" href=\"https://torbox.app/settings?section=notifications\"\
                        >settings page</a>, or when you get one of these emails.</p></li></ul></li><li><p>You\
                        \ can now subscribe and unsubscribe from the different type\
                        \ of marketing emails in the <a target=\"\" rel=\"noopener\
                        \ noreferrer nofollow\" class=\"link\" href=\"https://torbox.app/settings?section=notifications\"\
                        >settings page</a>. The Notifications Settings page is now\
                        \ also split up into two different sections, transactional\
                        \ emails, which are for general notifications relating to\
                        \ downloads, payments and others; and marketing, which is\
                        \ for updates about the platform in general, and not relating\
                        \ to your account.</p></li></ul><h2>Service</h2><ul><li><p>The\
                        \ TorBox CDN gains over 30% performance increase, including\
                        \ single connection speed, multi-connection speed, ramp up\
                        \ speed, seek speed and TTFB (time to first byte), which should\
                        \ all improve how fast your downloads begin.</p></li><li><p>Files\
                        \ should now be more compatible with all video player software\
                        \ to prevent infinite loading in some cases with specific\
                        \ files with specific video players.</p></li></ul><h2>API</h2><ul><li><p>The\
                        \ API was further optimized across multiple calls, including\
                        \ any route that accepts authentication, saving around 20ms\
                        \ per request, adding up to thousands of hours of CPU time\
                        \ saved over the course of a year, for a single optimization.\
                        \ More routes were optimized to stack savings, as well.</p></li></ul><h2>Web\
                        \ Downloads</h2><ul><li><p>Optimizes Telegram downloads providing\
                        \ up to 3x more download speed than previously.</p></li><li><p>Optimizes\
                        \ Mega downloads providing more than 4x more download speed\
                        \ than previously.</p></li><li><p>Fixes Datavaults downloads.</p></li><li><p>Makes\
                        \ YouTube downloads more reliable.</p></li><li><p>Makes HubDrive\
                        \ downloads more reliable.</p></li><li><p>Adds Discord downloader.\
                        \ Accepts Discord cdn links.</p><ul><li><p>This was needed\
                        \ for the Discord bot, read below.</p></li></ul></li><li><p>Fixes\
                        \ and re-enables the Katfile downloader.</p></li><li><p>Fixes\
                        \ and re-enables the Fileq downloader.</p></li><li><p>Fixes\
                        \ and re-enables the Sharemods downloader.</p></li><li><p>Fixes\
                        \ and re-enables the MegaUp downloader.</p></li><li><p>Fixes\
                        \ and re-enables the DailyUploads downloader.</p></li><li><p>Fixes\
                        \ and re-enables the Buzzheavier downloader.</p></li><li><p>Fixes\
                        \ the Fuckingfast downloader.</p></li></ul><h2>Discord Bot</h2><ul><li><p>The\
                        \ Discord bot now accepts files in DMs. Simply send a file\
                        \ to the Discord bot directly, and the file will be added\
                        \ to your TorBox account.</p></li><li><p>Discord bot link\
                        \ button takes you directly to the login screen so you can\
                        \ link your TorBox and Discord accounts without much navigating.</p></li></ul><h2>Telegram\
                        \ Bot</h2><ul><li><p>The Telegram bot now accepts files directly.\
                        \ Simply forward or send a file to the Telegram bot and the\
                        \ file will be added to your TorBox account.</p></li></ul><p></p><p></p>"
                      created_at: 2026-08-17T11:16:45.710000+00:00
                      name: v9.2
                      link: https://torbox.app/changelog#v92
                      image: https://imagedelivery.net/wjdNJcfLJD9TRxMb-PzPxw/torbox-changelog-v92/public
                      slug: v92
                      categories:
                      - New
                      - Improved
                      - Fixed
                    - id: 115
                      html: "<h2>T3</h2><ul><li><p>Fixes random 403 errors on HEAD/GET.</p></li><li><p>Allows\
                        \ <a target=\"\" rel=\"noopener noreferrer nofollow\" class=\"\
                        link\" href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_sigv.html\"\
                        >v4a authentication</a>.</p><ul><li><p>This now means T3 supports\
                        \ all authentication types available.</p></li></ul></li><li><p>Lists\
                        \ more than 10k items.</p><ul><li><p>If you have more than\
                        \ 10k torrents, it will now show all of them.</p></li></ul></li></ul><h2>WebDAV</h2><ul><li><p>Lists\
                        \ more than 10k items.</p><ul><li><p>If you have more than\
                        \ 10k torrents, it will now show all of them.</p></li></ul></li></ul><h2>API</h2><ul><li><p>The\
                        \ API was rewritten to be fully async, which means less timeout\
                        \ errors, and better reliability.</p></li><li><p>Download\
                        \ links are now much faster, going from best case scenario\
                        \ of ~300ms → ~150ms, a 100% increase from before! This is\
                        \ definitely a noticeable increase.</p></li></ul><h2>Website</h2><ul><li><p>Adds\
                        \ Greek, Vietnamese, and Thai languages to available preferred\
                        \ subtitle and audio languages in the web player settings.</p></li></ul><h2>Web\
                        \ Downloads</h2><ul><li><p>Fixes AnnasArchives downloads.</p></li><li><p>Adds\
                        \ Telegram downloader. Simply copy a message link which contains\
                        \ media and paste it into TorBox, and it will begin downloading!</p></li><li><p>Adds\
                        \ TransferNow downloader. Supports folders as well as password\
                        \ protected files.</p></li><li><p>Fixes Filer downloads.</p></li><li><p>Fixes\
                        \ issues with Mega folder downloads size not being properly\
                        \ counted.</p></li><li><p>Makes large 1Fichier downloads more\
                        \ reliable.</p></li><li><p>Fixes unreliable YouTube downloads.</p></li><li><p>Fixes\
                        \ HubCloud downloads.</p></li><li><p>Fixes Vikingfile downloads\
                        \ in some cases.</p></li><li><p>Pixeldrain now skips undownloadable\
                        \ files rather than marking the entire list as failed. Pixeldrain\
                        \ also now allows “filesystem” direct downloads.</p></li><li><p>Fixes\
                        \ Datavaults downloads.</p></li><li><p>Users will no longer\
                        \ be able to submit downloads to the API when the Web Downloader\
                        \ is marked offline, or when that hoster is marked offline.</p></li><li><p>Sendnow\
                        \ allows for direct links.</p></li><li><p>Fixes Datanodes\
                        \ downloads.</p></li></ul><h2>Transcoding Server</h2><ul><li><p>Improves\
                        \ performance when streaming, meaning better seeking times,\
                        \ less buffering, and more segments instantly available.</p></li></ul><h2>Service</h2><ul><li><p>New\
                        \ policies, located at <a target=\"_blank\" rel=\"noopener\
                        \ noreferrer nofollow\" class=\"link\" href=\"https://torbox.app/policies\"\
                        >https://torbox.app/policies</a>, which shows our new comprehensive\
                        \ set of policies. Largely TorBox remains unchanged with these\
                        \ new policies, but they were enacted to protect your rights\
                        \ and privacy, as well as our own.</p></li><li><p>TorBox main\
                        \ headquarters moves from South Africa to Dubai.</p><ul><li><p>This\
                        \ was done due to the instability of the country in the recent\
                        \ times.</p></li></ul></li><li><p>Our AI agents that handle\
                        \ support are much smarter with the ability to access your\
                        \ basic account information such as account plan, days on\
                        \ account, recent transactions, and more.</p></li></ul><p></p><p></p>"
                      created_at: 2026-07-31T05:45:48.424000+00:00
                      name: v9.1
