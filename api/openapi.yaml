  /v1/api/user/auth/device/start:
    get:
      description: |
        ### Overview

        Starts the device code authorization process. Returns all the necessary information to complete the rest of the flow. This includes the following:

        - `device_code` - The code your app will use for consecutive requests for getting the user token.

        - `code` - This is the 6 digit code that you show to the user to be entered at the following verification_url.

        - `verification_url` - This url which you will show as a QR code.

        - `friendly_verification_url` - The friendly short url which you can show as plain text to user if they cannot use the QR code method.


        You may also submit the `app` parameter to this request to show your app name on the `verification_url` page. This concretes user trust in authorizing your application to use their TorBox account. This is not required, but is a good idea. Default is "Third Party App". This name is also only allowed to be alpha-numeric characters (_A-Z,0-9_). Anything else will be filtered our when being shown to the user. The `friendly_verification_url` will always show "Third Party App" to keep the URL short.

        The device_code is only valid for 10 minutes. Make sure the user is aware of this time limit so they submit and login before this time limit is over.

        ### Authorization

        None required.
      operationId: start_device_code_authorization_process
      parameters:
      - description: The app name that the user will see when verifying the code.
          This should be the name of your app.
        explode: true
        in: query
        name: app
        required: false
        schema:
          default: Third Party App
          title: App
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                Success:
                  value:
                    success: true
                    error: null
                    detail: Successfully created your device code authorization.
                    data:
                      device_code: string
                      code: "123456"
                      interval: 0
                      expires_in: 0
                      expires_at: 2026-01-01T00:00:00Z
                      verification_url: https://torbox.app/oauth/device?app=Third+Party+App
                      verification_url_complete: https://torbox.app/oauth/device?app=Third+Party+App&code=123456
                      friendly_verification_url: https://tor.box/link
              schema:
                $ref: "#/components/schemas/StartDeviceCodeAuthorizationProcessResponse"
          description: Successful Response
        "404":
          content:
            application/json:
              examples:
                Fail ENDPOINT_NOT_FOUND:
                  value:
                    success: false
                    error: ENDPOINT_NOT_FOUND
                    detail: Endpoint not found. Please check the URL and try again.
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
        "429":
          content:
            application/json:
              examples:
                Fail RATE_LIMIT_EXCEEDED:
                  value:
                    success: false
                    error: RATE_LIMIT_EXCEEDED
                    detail: 300 per 1 minute
                    data: null
                Fail RATE_LIMIT_EXCEEDED (2):
                  value:
                    success: false
                    error: RATE_LIMIT_EXCEEDED
                    detail: 30 per 1 minute
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Too Many Requests
        "500":
          content:
            application/json:
              examples:
                Fail UNKNOWN_ERROR:
                  value:
                    success: false
                    error: UNKNOWN_ERROR
                    detail: There was an error creating your device code authorization.
                      Please try again later.
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal Server Error
      summary: Start Device Code Authorization Process
      tags:
      - User
  /v1/api/user/auth/device/token:
    post:
      description: |
        ### Overview

        Gets the user's API token from the device code authorization process. This endpoint is expected to be polled in interval until it returns success, or until the expiry has passed. All data you need for this request is in the [original request](https://api.torbox.app/docs#/User/start_device_code_authorization_process), which includes the interval to be polled by, the expiry time to stop at, and `device_code` to be sent to the API to get the correct data.

        ### Authorization

        None required.
      operationId: get_token_from_device_code_process
      requestBody:
        content:
          application/json:
            example:
              device_code: XXXXXXXXXXXXXXXXXXXXXXXXX
            schema:
              $ref: "#/components/schemas/DeviceTokenSchema"
