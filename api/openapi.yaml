  /v1/api/integration/googledrive:
    post:
      description: |
        ### Overview

        Uploads a file, or a zip of a whole download, from your TorBox account to a Google Drive. Send the `id` of the torrent, usenet download or web download, its `type`, and either the `file_id` of one file or `zip` set to true. In `google_token` you send a Google OAuth access token for the Drive to upload to. The login started by Authenticate OAuth with the provider `google` asks Google for the `drive.file` scope and ends with such a token.

        The route answers at once with a `job_id`. The upload itself runs in the background as a transfer job, and nothing is checked with Google before the answer, so a token Google does not accept only shows up as a failed job. Follow the job with Get Specific Job (`/v1/api/integration/job/{job_id}`), Get All Jobs (`/v1/api/integration/jobs`) or Get All Jobs By Hash (`/v1/api/integration/jobs/{hash}`), and stop it with Cancel Specific Job.

        The job goes from "pending" through "preparing" and "uploading" to "completed" or "failed". Its `detail` says what it is doing or why it failed, and its `progress` runs from 0 to 1. When it is completed, its `download_url` is the link to the file on Google Drive and you get an "Upload Complete" notification. A failed job is deleted about an hour after it failed, a completed job about 7 days after it completed.

        The download has to be cached on TorBox, otherwise the job fails. If you send neither `file_id` nor `zip`, the request is still queued, but there is no file to upload and the job fails. If your settings have a `google_drive_folder_id`, the file is put in that folder.

        ### Authorization

        Requires an API key using the Authorization Bearer Header.
      operationId: upload_to_google_drive
      requestBody:
        content:
          application/json:
            example:
              id: 0
              file_id: 0
              zip: false
              type: torrent
              google_token: string
            schema:
              $ref: "#/components/schemas/AddToGoogleDrive"
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                Success:
                  value:
                    success: true
                    error: null
                    detail: Upload has been queued.
                    data:
                      job_id: 0
              schema:
                $ref: "#/components/schemas/UploadToGoogleDriveResponse"
          description: Successful Response
        "400":
          content:
            application/json:
              examples:
                Fail INVALID_OPTION:
                  value:
                    success: false
                    error: INVALID_OPTION
                    detail: "Invalid type. Please use either 'torrent', 'usenet',\
                      \ or 'webdownload'."
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Bad Request
        "401":
          content:
            application/json:
              examples:
                Fail NO_AUTH:
                  value:
                    success: false
                    error: NO_AUTH
                    detail: Please provide a valid API token.
                    data: null
                Fail BAD_TOKEN:
                  value:
                    success: false
                    error: BAD_TOKEN
                    detail: Your token is invalid or has expired. Please log in again
                      or reset your token.
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "403":
          content:
            application/json:
              examples:
                Fail AUTH_ERROR:
                  value:
                    success: false
                    error: AUTH_ERROR
                    detail: An error occurred while verifying your token. Please try
                      again.
                    data: null
                Fail PLAN_RESTRICTED_FEATURE:
                  value:
                    success: false
                    error: PLAN_RESTRICTED_FEATURE
                    detail: API feature not available on your plan. Please upgrade
                      to a paid plan to access the API.
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Forbidden
        "404":
          content:
            application/json:
              examples:
                Fail ENDPOINT_NOT_FOUND:
                  value:
                    success: false
                    error: ENDPOINT_NOT_FOUND
                    detail: Endpoint not found. Please check the URL and try again.
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
        "429":
          content:
            application/json:
              examples:
                Fail RATE_LIMIT_EXCEEDED:
                  value:
                    success: false
                    error: RATE_LIMIT_EXCEEDED
                    detail: 300 per 1 minute
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Too Many Requests
        "500":
          content:
            application/json:
              examples:
                Fail UNKNOWN_ERROR:
                  value:
                    success: false
                    error: UNKNOWN_ERROR
                    detail: There was an error adding the file to Google Drive.
                    data: null
                Fail DATABASE_ERROR:
                  value:
                    success: false
                    error: DATABASE_ERROR
                    detail: Failed to get file information. Please try again.
                    data: null
                Fail DATABASE_ERROR (2):
                  value:
                    success: false
                    error: DATABASE_ERROR
                    detail: Failed to create a new upload. Please try again later.
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal Server Error
        "503":
          content:
            application/json:
              examples:
                Fail AUTH_UNAVAILABLE:
                  value:
                    success: false
                    error: AUTH_UNAVAILABLE
                    detail: We couldn't verify your token right now. Please try again
                      shortly.
                    data: null
                Fail AUTH_UNAVAILABLE (2):
                  value:
                    success: false
                    error: AUTH_UNAVAILABLE
                    detail: There was an error verifying your API key. Please try
                      again later.
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Service Unavailable
