  /v1/api/torrents/torrentinfo:
    get:
      description: |
        ### Overview

        A general route that allows you to give a hash, and TorBox will return data about the torrent. This data is retrieved from the Bittorrent network, so expect it to take some time. If the request goes longer than 10 seconds, TorBox will cancel it. You can adjust this if you like, but the default is 10 seconds. This route is cached as well, so subsequent requests will be instant.

        **It is not recommended to use this for checking TorBox's cache. Please use the GET /checkcache endpoint instead.**

        ### Authorization

        None required.
      operationId: get_torrent_info
      parameters:
      - description: Hash of the torrent you want to get info for. This is required.
        explode: true
        in: query
        name: hash
        required: true
        schema:
          title: Hash
          type: string
        style: form
      - description: "The amount of time you want TorBox to search for the torrent\
          \ on the Bittorrent network. If the number of seeders is low or even zero,\
          \ this value may be helpful to move up. Default is 10. Optional."
        explode: true
        in: query
        name: timeout
        required: false
        schema:
          default: 30
          format: int64
          title: Timeout
          type: integer
        style: form
      - description: If you want to use a pre-cached request if sent before. This
          can save a lot of time. Default false.
        explode: true
        in: query
        name: use_cache_lookup
        required: false
        schema:
          default: false
          title: Use Cache Lookup
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                Success:
                  value:
                    success: true
                    error: null
                    detail: Successfully retrieved torrent metadata for the hash.
                    data:
                      name: string
                      hash: string
                      size: 0
                      trackers: []
                      seeds: 0
                      peers: 0
                      files:
                      - name: string
                        size: 0
                Success CACHED:
                  value:
                    success: true
                    error: null
                    detail: Found Cached Torrent. Using Cached Torrent.
                    data:
                      name: string
                      hash: string
                      size: 0
                      trackers: []
                      seeds: 0
                      peers: 0
                      files:
                      - id: 0
                        name: string
                        size: 0
                Success DOWNLOAD_METADATA_ERROR:
                  value:
                    success: true
                    error: DOWNLOAD_METADATA_ERROR
                    detail: "Could not download full metadata for the torrent within\
                      \ the alloted timeout, but was able to retrieve tracker information.\
                      \ There may be data attached. Please try again later."
                    data:
                      name: null
                      hash: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                      size: null
                      trackers:
                      - udp://tracker.example.org:1337/announce
                      seeds: 12
                      peers: 3
                      files: null
              schema:
                $ref: "#/components/schemas/GetTorrentInfoResponse"
          description: Successful Response
        "400":
          content:
            application/json:
              examples:
                Fail BOZO_TORRENT:
                  value:
                    success: false
                    error: BOZO_TORRENT
                    detail: Invalid torrent. Please try again.
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Bad Request
        "404":
          content:
            application/json:
              examples:
                Fail ENDPOINT_NOT_FOUND:
                  value:
                    success: false
                    error: ENDPOINT_NOT_FOUND
                    detail: Endpoint not found. Please check the URL and try again.
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
        "429":
          content:
            application/json:
              examples:
                Fail RATE_LIMIT_EXCEEDED:
                  value:
                    success: false
                    error: RATE_LIMIT_EXCEEDED
                    detail: 300 per 1 minute
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Too Many Requests
        "500":
          content:
            application/json:
              examples:
                Fail UNKNOWN_ERROR:
                  value:
                    success: false
                    error: UNKNOWN_ERROR
                    detail: There was an error processing your request. Please try
                      again later.
                    data: null
                Fail DOWNLOAD_SERVER_ERROR:
                  value:
                    success: false
                    error: DOWNLOAD_SERVER_ERROR
                    detail: Could not download full metadata for the torrent within
                      the alloted timeout.
                    data: null
                Fail UNKNOWN_ERROR (2):
                  value:
                    success: false
                    error: UNKNOWN_ERROR
                    detail: Could not download full metadata for the torrent. There
                      may be data below. Please try again later.
                    data:
                      name: null
                      hash: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                      size: null
                      trackers:
                      - udp://tracker.example.org:1337/announce
                      seeds: 0
                      peers: 0
                      files: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal Server Error
      summary: Get Torrent Info
      tags:
      - Torrents
