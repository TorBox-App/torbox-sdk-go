  /v1/api/torrents/mylist:
    get:
      description: |
        ### Overview

        Gets the user's torrent list. This gives you the needed information to perform other torrent actions. This information only gets updated every 600 seconds, or when the _Request Update On Torrent_ request is sent to the _relay API_.

        #### Download States:

        - "downloading" -> The torrent is currently downloading.

        - "uploading" -> The torrent is currently seeding.

        - "stalled (no seeds)" -> The torrent is trying to download, but there are no seeds connected to download from.

        - "paused" -> The torrent is paused.

        - "completed" -> The torrent is completely downloaded. Do not use this for download completion status.

        - "cached" -> The torrent is cached from the server.

        - "metaDL" -> The torrent is downloading metadata from the hoard.

        - "checkingResumeData" -> The torrent is checking resumable data.


        All other statuses are basic qBittorrent states. [Check out here for the full list](https://github.com/qbittorrent/qBittorrent/wiki/WebUI-API-(qBittorrent-4.1)#torrent-management).

        ### Authorization

        Requires an API key using the Authorization Bearer Header.
      operationId: get_torrent_list
      parameters:
      - description: "Determines the torrent requested, will return an object rather\
          \ than list. Optional."
        explode: true
        in: query
        name: id
        required: false
        schema:
          format: int64
          title: Id
          type: integer
        style: form
      - description: "Allows you to bypass the cached data, and always get fresh information.\
          \ Useful if constantly querying for fresh download stats. Otherwise, we\
          \ request that you save our database a few calls."
        explode: true
        in: query
        name: bypass_cache
        required: false
        schema:
          default: false
          title: Bypass Cache
          type: boolean
        style: form
      - description: Determines the offset of items to get from the database. Default
          is 0. Optional.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int64
          title: Offset
          type: integer
        style: form
      - description: Determines the number of items to recieve per request. Default
          is 1000. Optional.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 1000
          format: int64
          title: Limit
          type: integer
        style: form
      - description: Exclude files from response. Optional
        explode: true
        in: query
        name: files
        required: false
        schema:
          default: true
          title: Files
          type: boolean
        style: form
      - description: Shows only active downloads. Optional
        explode: true
        in: query
        name: active
        required: false
        schema:
          title: Active
          type: boolean
        style: form
      responses:
