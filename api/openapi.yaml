  /v1/api/speedtest:
    get:
      description: |
        ### Overview

        Gets CDN speedtest files. This can be used for speedtesting TorBox for users or other usages, such as checking download speeds for verification. Provides all necessary data such as region, server name, and even coordinates. Uses the requesting IP to determine if the server is the closest to the user.

        You also have the ability to choose between long tests or short tests via the "test_length" parameter. You may also force the region selection by passing the "region" as a specific region.

        ### Authorization

        None needed.
      operationId: get_speedtest_files
      parameters:
      - description: "Pass a user's IP to get the closest server to them, otherwise\
          \ will use the calling IP for location."
        explode: true
        in: query
        name: user_ip
        required: false
        schema:
          title: User Ip
          type: string
        style: form
      - description: "Determines what cdns are returned. May be any region that TorBox\
          \ is located in. To get this value, send a request without this value to\
          \ determine all of the available regions that are available."
        explode: true
        in: query
        name: region
        required: false
        schema:
          default: all
          title: Region
          type: string
        style: form
      - description: Determines the size of the file used for the speedtest. May be
          "long" or "short". Optional.
        explode: true
        in: query
        name: test_length
        required: false
        schema:
          default: short
          title: Test Length
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                Success:
                  value:
                    success: true
                    detail: Successfully retrieved test files for speed test.
                    error: null
                    data:
                    - region: string
                      name: string
                      domain: https://XXX
                      path: string
                      url: https://XXX
                      closest: true
                      coordinates:
                        lat: 52.374
                        lng: 4.8897
              schema:
                $ref: "#/components/schemas/GetSpeedtestFilesResponse"
          description: Successful Response
        "404":
          content:
            application/json:
              examples:
                Fail ENDPOINT_NOT_FOUND:
                  value:
                    success: false
                    error: ENDPOINT_NOT_FOUND
                    detail: Endpoint not found. Please check the URL and try again.
                    data: null
                Fail ITEM_NOT_FOUND:
                  value:
                    success: false
                    error: ITEM_NOT_FOUND
                    detail: No test files for speed testing could be found. Please
                      try again later.
                    data: []
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
        "429":
          content:
            application/json:
              examples:
                Fail RATE_LIMIT_EXCEEDED:
                  value:
                    success: false
                    error: RATE_LIMIT_EXCEEDED
                    detail: 300 per 1 minute
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Too Many Requests
      summary: Get Speedtest Files
      tags:
      - General
