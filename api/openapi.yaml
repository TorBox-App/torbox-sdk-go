      responses:
        "200":
          content:
            application/json:
              examples:
                Success:
                  value:
                    success: true
                    error: null
                    detail: Token has been successfully redeemed. Save this token
                      as it will be used for all future API requests for this device.
                    data:
                      access_token: XXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
                      token_type: Bearer
              schema:
                $ref: "#/components/schemas/GetTokenFromDeviceCodeProcessResponse"
          description: Successful Response
        "400":
          content:
            application/json:
              examples:
                Fail DEVICE_CODE_NOT_USED:
                  value:
                    success: false
                    error: DEVICE_CODE_NOT_USED
                    detail: This device code has not been used yet. Please wait for
                      the user to scan the code.
                    data: null
                Fail DEVICE_CODE_USED:
                  value:
                    success: false
                    error: DEVICE_CODE_USED
                    detail: This device code has already been redeemed. Please start
                      a new link from your device.
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Bad Request
        "404":
          content:
            application/json:
              examples:
                Fail ENDPOINT_NOT_FOUND:
                  value:
                    success: false
                    error: ENDPOINT_NOT_FOUND
                    detail: Endpoint not found. Please check the URL and try again.
                    data: null
                Fail ITEM_NOT_FOUND:
                  value:
                    success: false
                    error: ITEM_NOT_FOUND
                    detail: The device code you entered is invalid or has expired.
                      Please try again.
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
        "429":
          content:
            application/json:
              examples:
                Fail RATE_LIMIT_EXCEEDED:
                  value:
                    success: false
                    error: RATE_LIMIT_EXCEEDED
                    detail: 300 per 1 minute
                    data: null
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Too Many Requests
        "500":
          content:
            application/json:
              examples:
                Fail UNKNOWN_ERROR:
